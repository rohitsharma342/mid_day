name: mid_day_tiffin
description: A user-friendly mobile app for ordering tiffin meals online.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  shared_preferences_web: ^2.2.1
  carousel_slider: ^4.2.1
  badges: ^3.1.2
  cached_network_image: ^3.3.0
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.19.0
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
